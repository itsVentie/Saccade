[package]
name = "saccade"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
crossbeam-channel = "0.5"
ort = { version = "2.0.0-rc.9", features = ["cuda"] } # Или directml / coreml при необходимости
ndarray = "0.16"
image = "0.25"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"